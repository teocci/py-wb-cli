[build-system]
requires = ['setuptools>=68.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'wb-cli'
version = '0.7.0'
description = 'Wildberries Advertising Operations CLI Framework'
readme = 'README.md'
requires-python = '>=3.11'
license = {text = 'MIT'}

dependencies = [
    'typer>=0.9.0',
    'httpx>=0.25.0',
    'rich>=13.0.0',
    'keyring>=24.0.0',
    'python-dotenv>=1.0.0',
    'pydantic>=2.0.0',
    'pydantic-settings>=2.0.0',
]

[project.optional-dependencies]
dev = [
    'pytest>=7.4.0',
    'pytest-cov>=4.1.0',
    'pytest-asyncio>=0.21.0',
    'respx>=0.20.0',
]

[project.scripts]
wb = 'wb.cli.app:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']
addopts = '-v --tb=short'

[tool.coverage.run]
source = ['wb']

[tool.coverage.report]
show_missing = true
skip_empty = true
